name: the_wisdom_project
description: "The Wisdom Project - A comprehensive Tipitaka and commentary browsing application"
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.5.2 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0

  # Immutable Models
  freezed_annotation: ^2.4.0

  # JSON Serialization
  json_annotation: ^4.9.0

  # Functional Programming (Either type for error handling)
  dartz: ^0.10.1

  # Unicode grapheme cluster support (for safe Sinhala text truncation)
  characters: ^1.3.0

  # Internationalization
  intl: any

  # Persistence
  shared_preferences: ^2.2.2

  # SQLite through Drift (FTS index + dictionary), read with raw SQL.
  #
  # Both pinned exactly, because the web build ships copies of their compiled
  # halves that a version range would silently outgrow: `web/drift_worker.js`
  # comes from the drift package root and `web/sqlite3.wasm` from the matching
  # sqlite3 release. A bump moves all four together — and check a fifth thing
  # with them: WebDatabaseInstaller mirrors drift's own OPFS folder name
  # (`drift_db`), which the package does not export.
  drift: 2.35.0
  sqlite3: 3.5.2
  path_provider: ^2.1.1
  path: ^1.8.3

  # Browser APIs (OPFS, fetch, Web Locks) for the web database installer
  web: ^1.1.0

  # zlib inflate for bjt_content page text (dart:io natively, pure Dart on web)
  archive: ^4.0.9

  # HTTP client (for web API calls to server)
  http: ^1.2.0

  # Shared logic between client and server
  wisdom_shared:
    path: packages/wisdom_shared

  # URL launching (in-app browser for DPD "Read more" links)
  url_launcher: ^6.2.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_gen: ^5.12.0
  material_symbols_icons: ^4.2906.0
  app_links: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  freezed: ^2.5.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^4.0.0
  mockito: ^5.4.4

  # Testing utilities
  fake_async: ^1.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Enable Material Design
  uses-material-design: true

  # Enable internationalization code generation
  generate: true

  # Assets
  #
  # NOTE: native reads databases/ out of the bundle; web downloads the same
  # files on a first visit, from this asset copy locally and from R2 once
  # DATABASE_BASE_URL is set. A deploy must then strip them from build/web/ —
  # nothing does that yet (docs/todo/web-strategy/web-release.md §6).
  assets:
    # Navigation tree and metadata (used on ALL platforms including web)
    - assets/data/tree.json
    - assets/data/file-map.json
    - assets/data/footnote-abbreviations.json
    - assets/data/sc-to-bjt.json
    # Full-text search database and page text - BJT edition
    - assets/databases/bjt.db
    # Dictionary database - Pali-English/Sinhala
    - assets/databases/dict.db
    # SHA-256 of each database above; the app recopies a database when it changes
    - assets/databases/manifest.json
    # UI icons / illustrations
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts for Sinhala script and cross-platform consistency
  # See docs/font_system_plan.md for font selection rationale
  fonts:
    # The two Sinhala families bundle the *-Subset.ttf built by
    # assets/fonts/subset_fonts.sh, not the full faces beside them. The static
    # site self-hosts the woff2 compressed from those very same subsets, so app
    # and web render Sinhala from one identical glyph set. Regenerate both by
    # re-running the script; never hand-edit one side.
    #
    # Sinhala script for UI elements (sans-serif)
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/noto-sans-sinhala/NotoSansSinhala-Regular-Subset.ttf
          weight: 400
        - asset: assets/fonts/noto-sans-sinhala/NotoSansSinhala-Medium-Subset.ttf
          weight: 500
        - asset: assets/fonts/noto-sans-sinhala/NotoSansSinhala-SemiBold-Subset.ttf
          weight: 600
        - asset: assets/fonts/noto-sans-sinhala/NotoSansSinhala-Bold-Subset.ttf
          weight: 700

    # Sinhala script for Pali content (serif - better conjunct rendering)
    - family: NotoSerifSinhala
      fonts:
        - asset: assets/fonts/noto-serif-sinhala/NotoSerifSinhala-Regular-Subset.ttf
          weight: 400
        - asset: assets/fonts/noto-serif-sinhala/NotoSerifSinhala-Medium-Subset.ttf
          weight: 500
        - asset: assets/fonts/noto-serif-sinhala/NotoSerifSinhala-SemiBold-Subset.ttf
          weight: 600
        - asset: assets/fonts/noto-serif-sinhala/NotoSerifSinhala-Bold-Subset.ttf
          weight: 700

    # Serif font for romanized Pali with diacritics and English
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/noto-serif/NotoSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto-serif/NotoSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/noto-serif/NotoSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto-serif/NotoSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto-serif/NotoSerif-Bold.ttf
          weight: 700

    # Noto Sans for Latin/English characters - FALLBACK for Sinhala fonts
    # Same Noto design language ensures visual harmony
    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto-sans/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto-sans/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto-sans/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto-sans/NotoSans-Bold.ttf
          weight: 700
